name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux system libraries (Qt + X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        working-directory: Main
        run: xvfb-run -a python -m unittest discover -s tests -t . -v
      - name: Unit tests
        if: runner.os != 'Linux'
        working-directory: Main
        run: python -m unittest discover -s tests -t . -v
      - name: Self-test incl. GUI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python Main/main.py --selftest-gui
      - name: Self-test incl. GUI
        if: runner.os != 'Linux'
        run: python Main/main.py --selftest-gui
      - name: Build-system dry run
        run: python Build/build.py --dry-run --ci

  screenshots:
    name: README screenshots
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Generate screenshots
        run: xvfb-run -a python Build/screenshots.py
      - name: Commit refreshed screenshots
        run: |
          git config user.name "4R022 Build Bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || (git commit -m "docs: refresh screenshots [skip ci]" && git push)
